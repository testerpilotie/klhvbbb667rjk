<!DOCTYPE html>
<html>
<head>
    <title>Optihol</title>
    <!-- Using simple SVG chart instead of Chart.js to avoid CSP issues -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Optihol</h1>
    
    <div id="bac-display">
        BAC: <span id="bac-value">0.000</span>‰
    </div>
    
    <div class="detail">
        Pending: +<span id="pending-value">0.000</span>‰ | 
        Peak: <span id="peak-value">0.000</span>‰
    </div>
    
    <div id="status" class="below">
        Below Zone
    </div>
    
    <div>
        <button onclick="addDrink()">🍺 Add Beer</button>
        <button onclick="resetSession()">🔄 Reset</button>
        <button onclick="openSettings()">⚙️ Settings</button>
    </div>
    
    <div id="next-drink">
        Next Drink: <span id="next-drink-text">Ready to start</span>
    </div>
    
    <div id="chart-container">
        <svg id="bac-chart" width="100%" height="400" viewBox="0 0 800 400">
            <defs>
                <linearGradient id="zoneGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:rgba(76,175,80,0.2);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:rgba(76,175,80,0.1);stop-opacity:1" />
                </linearGradient>
            </defs>
            <!-- Grid lines will be added here -->
            <!-- BAC curve will be added here -->
            <!-- Optimal zone will be added here -->
            <text x="400" y="200" text-anchor="middle" fill="#999" font-family="Arial" font-size="16">
                Loading BAC chart...
            </text>
        </svg>
    </div>
    
    
    <div id="info">
        Drinks: <span id="drink-count">0</span><br>
        Zone: <span id="zone-display">0.5‰ - 0.7‰</span><br>
    </div>
    
    <div style="margin: 20px auto; max-width: 400px; font-family: monospace; font-size: 14px;">
        <h3>BAC Timeline</h3>
        <table id="bac-timeline" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background: #ddd;">
                    <th style="border: 1px solid #ccc; padding: 5px;">Time</th>
                    <th style="border: 1px solid #ccc; padding: 5px;">BAC (‰)</th>
                </tr>
            </thead>
            <tbody id="bac-timeline-body">
                <tr><td colspan="2" style="text-align: center; padding: 10px;">No data</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeSettings()">&times;</span>
            <h2>User Settings</h2>
            <form id="settingsForm">
                <div class="form-group">
                    <label for="weight">Weight (kg):</label>
                    <input type="number" id="weight" name="weight" required min="30">
                </div>
                <div class="form-group">
                    <label for="height">Height (cm):</label>
                    <input type="number" id="height" name="height" required min="100">
                </div>
                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" required min="18">
                </div>
                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <button type="submit">Save and Recalculate</button>
            </form>
        </div>
    </div>

    <script src="/static/script.js" defer></script>
</body>
</html>
