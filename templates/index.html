<!DOCTYPE html>
<html>
<head>
    <title>Optihol</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.0.2/dist/chartjs-plugin-annotation.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Optihol</h1>
    
    <div id="bac-display">
        BAC: <span id="bac-value">0.000</span>‰
    </div>
    
    <div class="detail">
        Pending: +<span id="pending-value">0.000</span>‰ | 
        Peak: <span id="peak-value">0.000</span>‰
    </div>
    
    <div id="status" class="below">
        Below Zone
    </div>
    
    <div>
        <button onclick="quickAddBeer()">⚡ Quick Add Beer</button>
        <button onclick="openAddDrinkModal()">🍺 Add Drink</button>
        <button onclick="resetSession()">🔄 Reset</button>
        <button onclick="openSettings()">⚙️ Settings</button>
    </div>
    
    <div id="chart-container" style="width: 80%; max-width: 900px; margin: auto;">
        <canvas id="bacChart"></canvas>
    </div>

    <div style="margin: 20px auto; max-width: 400px; font-family: monospace; font-size: 14px;">
        <table id="drinks-log" style="width: 100%; border-collapse: collapse;">
            <caption id="drinks-log-caption" style="caption-side: top; text-align: left; padding: 5px; font-weight: bold;"></caption>
            <thead>
                <tr style="background: #ddd;">
                    <th style="border: 1px solid #ccc; padding: 5px;">Time</th>
                    <th style="border: 1px solid #ccc; padding: 5px;">Drink Type</th>
                    <th style="border: 1px solid #ccc; padding: 5px;">Size</th>
                </tr>
            </thead>
            <tbody id="drinks-log-body">
                <tr><td colspan="2" style="text-align: center; padding: 10px;">No data</td></tr>
            </tbody>
        </table>
    </div>
    
    <div id="info">
        Optimal Zone: <span id="zone-display">0.5‰ - 0.7‰</span><br>
    </div>

    <!-- Add Drink Modal -->
    <div id="addDrinkModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeAddDrinkModal()">&times;</span>
            <h2>Add a Drink</h2>
            <form id="addDrinkForm">
                <div class="form-group">
                    <label for="drinkType">Drink Type:</label>
                    <select id="drinkType" name="drinkType">
                        <option value="Beer">Beer</option>
                        <option value="Wine">Wine</option>
                        <option value="Spirits">Spirits</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group" id="drinkSizeContainer" style="display: none;">
                    <label for="drinkSize">Size:</label>
                    <select id="drinkSize" name="drinkSize">
                        <!-- Options will be populated dynamically by JavaScript -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Time:</label>
                    <input type="radio" id="timeNow" name="drinkTime" value="0" checked> <label for="timeNow">Now</label><br>
                    <input type="radio" id="time15" name="drinkTime" value="15"> <label for="time15">15 min ago</label><br>
                    <input type="radio" id="time30" name="drinkTime" value="30"> <label for="time30">30 min ago</label><br>
                    <input type="radio" id="time60" name="drinkTime" value="60"> <label for="time60">1 hour ago</label><br>
                </div>
                <button type="submit">Add</button>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeSettings()">&times;</span>
            <h2>User Settings</h2>
            <form id="settingsForm">
                <div class="form-group">
                    <label for="weight">Weight (kg):</label>
                    <input type="number" id="weight" name="weight" required min="30">
                </div>
                <div class="form-group">
                    <label for="height">Height (cm):</label>
                    <input type="number" id="height" name="height" required min="100">
                </div>
                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" required min="18">
                </div>
                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <button type="submit">Save and Recalculate</button>
            </form>
        </div>
    </div>

    <script src="/static/database.js" defer></script>
    <script src="/static/chart.js" defer></script>
    <script src="/static/script.js" defer></script>
</body>
</html>
